<div class="dashboard-container">
  <header>
    <h1>Panel de control</h1>
    <p>Bienvenido, <strong>{{ username }}</strong></p>
    <a routerLink="/welcome" class="btn-logout">Cerrar sesión</a>
  </header>

  <section class="stats">
    <div class="card">Archivos analizados: 12</div>
    <div class="card">Amenazas detectadas: 3</div>
  </section>

  <section class="files-section">
    <h2>Archivos subidos</h2>
    <button (click)="onUploadClick()" class="btn-upload">Subir archivo</button>
    <input type="file" #fileInput style="display:none" (change)="uploadFile($event)">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Fecha</th>
          <th>Resultado</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let file of files">
          <td>{{ file.name }}</td>
          <td>{{ file.date }}</td>
          <td>{{ file.result }}
            <button (click)="analyzeFile(file.id)">Analizar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </section>
</div>
